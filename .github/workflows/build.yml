name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make test

  # Pure Go: cross-compiled from Linux.
  windows-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make windows linux
      - uses: actions/upload-artifact@v4
        with: { name: windows-linux, path: dist/* }

  # The macOS tray icon needs cgo, so build on a Mac.
  darwin:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make darwin
      - uses: actions/upload-artifact@v4
        with: { name: darwin, path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-linux, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
